<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <!-- Reuse the main styling (fonts, background, buttons) -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css">
    <style>
        .error-wrapper {
            /* We use the glassmorphism card as the base */
            background: rgba(30, 41, 59, 0.5); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: slideUpFade 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        .error-panel {
            /* The floating colorful panel popping out */
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            padding: 60px 50px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .error-code {
            font-size: 140px;
            font-weight: 800;
            margin: 0;
            line-height: 1;
            text-shadow: 0 15px 25px rgba(0,0,0,0.2);
            letter-spacing: -5px;
        }

        .error-message {
            font-size: 28px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .error-desc {
            font-size: 15px;
            margin-bottom: 40px;
            color: #e2e8f0;
            line-height: 1.6;
        }

        @keyframes slideUpFade {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="error-wrapper">
        <div class="error-panel">
            <h1 class="error-code">404</h1>
            <h2 class="error-message">Oops! You're lost.</h2>
            <p class="error-desc">The page you are looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
            <a href="index.html">
                <button class="ghost"><i class="fas fa-home" style="margin-right: 8px;"></i> Go Back Home</button>
            </a>
        </div>
    </div>
</body>
</html>
